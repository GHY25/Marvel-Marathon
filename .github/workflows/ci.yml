name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # This job compiles and tests Node code. Windows below runs the real app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test domain, storage and security
        run: npm test

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install Electron with download retries
        shell: pwsh
        run: |
          for ($electronAttempt = 1; $electronAttempt -le 3; $electronAttempt++) {
            node node_modules/electron/install.js
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($electronAttempt -lt 3) {
              Write-Host "Electron download failed; retrying in 5 seconds ($electronAttempt/3)."
              Start-Sleep -Seconds 5
            }
          }
          exit 1
      - run: npm run test:e2e
      - run: npm run package:dir
